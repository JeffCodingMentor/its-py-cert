<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ITS Python 證照題庫：82 題複習與答題練習，自動保存答題紀錄。">
  <title>ITS Python v3.2｜選擇語言 / Choose language</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="./assets/styles.css?v=3.2-inter">
  <script defer src="./assets/questions.js?v=20261020-q09"></script>
  <script defer src="./assets/questions-en.js?v=20261020-q09"></script>
  <script defer src="./assets/explanations.js?v=20261020-q09"></script>
  <script defer src="./assets/app.js?v=3.2-submit"></script>
</head>
<body class="answer-mode">
  <main id="languageChooser" class="language-chooser" aria-labelledby="languageTitle">
    <section class="card">
      <h1 id="languageTitle">選擇語言 / <span lang="en">Choose your language</span></h1>
      <div class="language-actions">
        <button type="button" class="primary" data-language="zh-Hant" lang="zh-Hant">繁體中文</button>
        <button type="button" class="primary" data-language="en" lang="en">English</button>
      </div>
      <noscript><p>請啟用 JavaScript。<span lang="en">Please enable JavaScript.</span></p></noscript>
    </section>
  </main>
  <div id="siteApp" class="app" hidden>
    <header class="topbar">
      <div>
        <div class="eyebrow">CERTIPORT ITS PYTHON</div>
        <div class="title-row">
          <h1><span class="title-text"><span data-zh="Python 題庫 " data-en="Python Question Bank ">Python 題庫 </span><span class="version">v3.2</span></span></h1>
          <button id="modeToggle" class="mode-switch" type="button" role="switch" aria-label="答題模式" aria-checked="false" title="切換答題模式" disabled>
            <span class="mode-option review-option" aria-hidden="true" data-zh="複習" data-en="Study">複習</span>
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span class="mode-option quiz-option" aria-hidden="true" data-zh="答題" data-en="Quiz">答題</span>
          </button>
        </div>
      </div>
    </header>
    <p id="storageNotice" class="storage-notice" role="alert" hidden></p>
    <div class="context-bar">
      <button id="searchToggle" class="search-toggle" type="button" aria-label="隱藏搜尋" title="隱藏搜尋" aria-expanded="true" aria-controls="searchSidebar" disabled>&lt;&lt;</button>
      <div id="modeStatus" class="mode-status" role="status"></div>
      <button id="clearRecords" class="secondary" type="button" hidden data-zh="清除紀錄" data-en="Clear answers">清除紀錄</button>
    </div>
    <div id="quizControls" class="quiz-controls" hidden>
      <label class="jump-control" for="questionJump"><span data-zh="直接選題" data-en="Jump to question">直接選題</span>
        <select id="questionJump" aria-label="直接選題與答題狀態"></select>
      </label>
      <span id="recordSummary"></span>
      <span class="status-legend" data-zh="🔴 答錯　🟢 答對　⚪ 未答" data-en="🔴 Incorrect　🟢 Correct　⚪ Unanswered">🔴 答錯　🟢 答對　⚪ 未答</span>
      <div class="track" aria-hidden="true"><div id="progressBar" class="bar"></div></div>
    </div>
    <div id="workspace"></div>
    <noscript><section class="card">請啟用 JavaScript，以使用題庫、搜尋與答題紀錄。</section></noscript>
    <p id="quizHint" class="page-hint" hidden data-zh="送出後保存答案並鎖定；清除紀錄後才能重答。紀錄保存在此裝置與瀏覽器，切換模式或關閉網頁不會清除。" data-en="Submitted answers are saved and locked. Clear saved answers to try again. Records stay in this browser on this device, including after switching modes or closing the page.">送出後保存答案並鎖定；清除紀錄後才能重答。紀錄保存在此裝置與瀏覽器，切換模式或關閉網頁不會清除。</p>
  </div>
</body>
</html>
